<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>画像スタジオ(管理者用) | fortune luck Cat</title>
<style>
  :root{--bg:#faf6ee;--card:#fff;--ink:#2a2f4a;--muted:#6d6a5e;--accent:#b87f24;--line:rgba(42,47,74,.16);--err:#c05c4a}
  @media (prefers-color-scheme:dark){:root{--bg:#191e33;--card:#212845;--ink:#f0e9d9;--muted:#a8a293;--accent:#e3aa4f;--line:rgba(240,233,217,.15);--err:#e08a7a}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;line-height:1.6}
  main{max-width:960px;margin:0 auto;padding:24px 16px 48px}
  h1{font-size:1.4rem;margin:0 0 4px}.lead{color:var(--muted);margin:0 0 20px}
  .grid{display:grid;gap:20px;grid-template-columns:340px 1fr}@media(max-width:760px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 4px}label:first-child{margin-top:0}
  input,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
  textarea{min-height:96px;resize:vertical}
  button{margin-top:14px;margin-right:8px;padding:9px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;cursor:pointer}
  button:disabled{opacity:.5;cursor:wait}button.sub{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  img{max-width:100%;border-radius:8px;border:1px solid var(--line);display:block}
  #src{margin-top:8px;max-height:160px}#msg{margin-top:10px;color:var(--muted);font-size:.9rem}#msg.err{color:var(--err)}
  details{margin-bottom:12px;color:var(--muted);font-size:.85rem}
</style></head><body><main>
<h1>🎨 画像スタジオ(管理者用)</h1>
<p class="lead">プロンプトから、または画像をもとに新しい画像を生成します。</p>
<div class="grid">
  <div class="panel">
    <details><summary>接続設定</summary>
      <label for="ep">Worker URL</label><input id="ep" placeholder="https://fortune-luck-cat-imagegen.xxx.workers.dev">
      <label for="tk">管理者トークン</label><input id="tk" type="password" autocomplete="off">
      <div style="margin-top:6px">※ トークンはこのタブを閉じると消えます。</div>
    </details>
    <label for="prompt">プロンプト(日本語OK)</label>
    <textarea id="prompt" placeholder="例: 月夜に座る招き猫、水彩画風、金色のアクセント"></textarea>
    <label for="file">元画像(任意 / 指定すると画像から生成)</label>
    <input id="file" type="file" accept="image/*"><img id="src" alt="" hidden>
    <label for="st">元画像との違い: <span id="stv">0.6</span>(大きいほど大きく変化)</label>
    <input id="st" type="range" min="0.2" max="1" step="0.05" value="0.6">
    <button id="go">生成する</button><button id="dl" class="sub" hidden>保存</button>
    <div id="msg"></div>
  </div>
  <div class="panel"><img id="out" alt="生成結果" hidden><div id="en" class="lead" style="margin-top:8px"></div></div>
</div>
<p><a href="index.html" style="color:var(--accent)">← トップへ戻る</a></p>
</main>
<script>
const $=id=>document.getElementById(id);
try{$("ep").value=localStorage.getItem("imgEp")||"";$("tk").value=sessionStorage.getItem("imgTk")||""}catch(e){}
let srcData=null;
$("st").oninput=()=>$("stv").textContent=$("st").value;
$("file").onchange=e=>{
  const f=e.target.files[0];if(!f){srcData=null;$("src").hidden=true;return}
  const img=new Image();img.onload=()=>{
    const s=Math.min(1,512/Math.max(img.width,img.height));          // img2imgモデル向けに縮小
    const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    srcData=c.toDataURL("image/png");$("src").src=srcData;$("src").hidden=false};
  img.src=URL.createObjectURL(f)};
function say(t,err){$("msg").textContent=t;$("msg").className=err?"err":""}
$("go").onclick=async()=>{
  const ep=$("ep").value.trim(),tk=$("tk").value,prompt=$("prompt").value.trim();
  if(!ep||!tk)return say("接続設定(URLとトークン)を入力してください",1);
  if(!prompt)return say("プロンプトを入力してください",1);
  try{localStorage.setItem("imgEp",ep);sessionStorage.setItem("imgTk",tk)}catch(e){}
  $("go").disabled=true;say("生成中…(数秒〜数十秒)");
  try{
    const r=await fetch(ep,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tk},
      body:JSON.stringify({prompt,image:srcData||undefined,strength:+$("st").value})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error==="unauthorized"?"トークンが違います":(d.detail||d.error||r.status));
    $("out").src=d.image;$("out").hidden=false;$("dl").hidden=false;
    $("en").textContent=d.prompt_en&&d.prompt_en!==prompt?"英訳プロンプト: "+d.prompt_en:"";say("完了")
  }catch(e){say("エラー: "+e.message,1)}finally{$("go").disabled=false}};
$("dl").onclick=()=>{const a=document.createElement("a");a.href=$("out").src;a.download="generated.png";a.click()};
</script></body></html>
